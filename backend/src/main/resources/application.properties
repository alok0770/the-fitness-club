# Server Configuration (Render & local dynamic port support)
server.port=${PORT:8080}

# Database Configuration (PostgreSQL on Render / H2 fallback for zero-dependency local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/tfc_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Multipart File Upload (Cloudinary uploads up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Multi-Admin Credentials (Account 1: Owner, Account 2: Developer)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:TheFitnessClub@2026}
app.admin2.username=${ADMIN2_USERNAME:}
app.admin2.password=${ADMIN2_PASSWORD:}

# Demo Data Seeding (Disabled by default so deleted items are NEVER repopulated on server restart)
app.seed-demo-data=${SEED_DEMO_DATA:false}

# JWT Configuration (24 Hours = 86400000 ms)
app.jwt.secret=${JWT_SECRET:the-fitness-club-joshiyara-road-hq-uttarkashi-super-secret-jwt-key-minimum-256-bits-length}
app.jwt.expiration-ms=86400000

# Cloudinary Storage
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:zlxjt5uf}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:266162451312558}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:oCZELiJkZ2c4ik4zBEwRrJwWCPI}

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
